version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      windows-app-sdk:
        patterns: ["Microsoft.WindowsAppSDK.*"]
      xunit:
        patterns: ["xunit.*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
